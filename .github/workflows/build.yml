name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: win
            arch: x64
          - name: macOS Intel
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macOS Apple Silicon
            os: macos-15
            platform: mac
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Electron
        run: node node_modules/electron/install.js
      - name: Check syntax
        run: pnpm run check
      - name: Build packages
        run: pnpm exec electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: SLOOP-Editor-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
